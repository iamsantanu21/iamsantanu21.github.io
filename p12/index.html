<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P12 Prep Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#f6f5f1; --surface:#ffffff; --surface-2:#f0efe9;
    --ink:#191c22; --muted:#5c6270; --faint:#8a8f9c; --line:#e2e0d8;
    --teal:#0f766e; --teal-soft:#0f766e1a;
    --amber:#b45309; --amber-soft:#b453091a;
    --green:#15803d; --green-soft:#15803d1a;
    --blue:#1d4ed8; --blue-soft:#1d4ed81a;
    --red:#b42318;
    --shadow:0 1px 2px rgba(20,23,28,.05),0 6px 20px rgba(20,23,28,.06);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121519; --surface:#1a1e24; --surface-2:#20252c;
      --ink:#e9ebee; --muted:#a2a9b4; --faint:#727984; --line:#2c323a;
      --teal:#2dd4bf; --teal-soft:#2dd4bf1f;
      --amber:#f0a02c; --amber-soft:#f0a02c1f;
      --green:#4ade80; --green-soft:#4ade801f;
      --blue:#60a5fa; --blue-soft:#60a5fa1f;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#121519; --surface:#1a1e24; --surface-2:#20252c;
    --ink:#e9ebee; --muted:#a2a9b4; --faint:#727984; --line:#2c323a;
    --teal:#2dd4bf; --teal-soft:#2dd4bf1f;
    --amber:#f0a02c; --amber-soft:#f0a02c1f;
    --green:#4ade80; --green-soft:#4ade801f;
    --blue:#60a5fa; --blue-soft:#60a5fa1f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  img{max-width:100%}
  [hidden]{display:none!important}
  a{color:var(--teal)}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
  .wrap{max-width:860px;margin:0 auto;padding-inline:18px}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .topbar .row1{display:flex;align-items:center;gap:12px;padding-block:10px}
  .brand{font-weight:700;letter-spacing:-.01em;font-size:1rem;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .brand .dot{width:9px;height:9px;border-radius:99px;background:var(--teal)}
  .bar{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:60px}
  .bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:99px;transition:width .35s}
  #ovpct{font-size:.85rem;font-weight:600;font-family:"IBM Plex Mono",monospace;min-width:3.2ch;text-align:right}
  #saved{font-size:.68rem;color:var(--faint);white-space:nowrap;font-family:"IBM Plex Mono",monospace}

  /* tabs */
  nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;-ms-overflow-style:none;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{font:inherit;font-size:.85rem;font-weight:500;white-space:nowrap;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);padding:7px 13px;border-radius:99px;cursor:pointer;display:flex;align-items:center;gap:6px}
  nav.tabs button .n{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--faint)}
  nav.tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  nav.tabs button.active .n{color:var(--paper);opacity:.7}

  main{padding-block:22px 60px}
  h1{font-size:clamp(1.6rem,4.5vw,2.3rem);line-height:1.08;margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
  .lead{color:var(--muted);margin:0 0 4px;max-width:60ch}

  .panelhead{margin:6px 0 16px}
  .panelhead .ey{font-family:"IBM Plex Mono",monospace;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:0 0 8px}

  .group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
  .group > .gt{font-size:1.05rem;font-weight:700;letter-spacing:-.01em;margin:0}
  .group > .gs{color:var(--muted);font-size:.88rem;margin:2px 0 10px}
  .group > .gt + .rows{margin-top:10px}

  .rows{display:flex;flex-direction:column;gap:2px}
  .row{display:flex;gap:10px;align-items:flex-start;padding:7px 6px;border-radius:9px}
  .row:hover{background:var(--surface-2)}
  .chk{flex:none;margin-top:1px}
  .chk input{appearance:none;-webkit-appearance:none;margin:0;width:19px;height:19px;border:1.8px solid var(--faint);
    border-radius:6px;display:grid;place-content:center;cursor:pointer;transition:.12s}
  .chk input:checked{background:var(--teal);border-color:var(--teal)}
  .chk input:checked::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translateY(-1px)}
  .chk input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  .main{flex:1;min-width:0}
  .txt{font-size:.94rem;line-height:1.45}
  .row.done .txt{color:var(--faint);text-decoration:line-through}
  .row.done .txt *{color:var(--faint)!important}
  .txt .wk{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.8rem;background:var(--surface-2);padding:1px 7px;border-radius:5px;margin-right:4px}
  .txt .st{color:var(--amber);font-weight:600}
  .txt em{font-style:normal;color:var(--muted)}
  .txt b{font-weight:600}
  .notebtn{flex:none;border:none;background:transparent;cursor:pointer;font-size:.95rem;opacity:.4;padding:2px 4px;border-radius:6px;line-height:1}
  .notebtn:hover{opacity:.9;background:var(--surface-2)}
  .notebtn.has{opacity:1}
  .notewrap{margin-top:7px}
  .notewrap textarea{width:100%;min-height:60px;resize:vertical;font:inherit;font-size:.88rem;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .notewrap textarea:focus{outline:2px solid var(--teal);outline-offset:1px;background:var(--surface)}
  .row.hasnote{background:var(--amber-soft)}

  .gprog{font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--muted);float:right;background:var(--surface-2);padding:2px 8px;border-radius:6px}

  /* dashboard */
  .dashcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:14px}
  .dashcard h3{margin:0 0 12px;font-size:1.02rem}
  .stat{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .stat:last-child{margin-bottom:0}
  .stat .nm{width:120px;font-size:.9rem;font-weight:500;display:flex;align-items:center;gap:7px}
  .stat .cnt{font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--muted);min-width:66px;text-align:right}
  .btnrow{display:flex;flex-wrap:wrap;gap:9px}
  .btn{font:inherit;font-size:.88rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:9px 15px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--teal)}
  .btn.primary{background:var(--teal);color:#fff;border-color:var(--teal)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.danger{color:var(--red)}
  .steps{counter-reset:s;list-style:none;margin:8px 0 0;padding:0}
  .steps li{position:relative;padding:6px 0 6px 34px;font-size:.9rem;color:var(--muted)}
  .steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:5px;width:22px;height:22px;
    background:var(--teal-soft);color:var(--teal);border-radius:99px;display:grid;place-content:center;font-size:.78rem;font-weight:600;font-family:"IBM Plex Mono",monospace}
  .steps li b{color:var(--ink)}
  code{font-family:"IBM Plex Mono",monospace;font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
  .hint{font-size:.82rem;color:var(--faint);margin-top:10px}
  .inp{flex:1;min-width:180px;font:inherit;font-size:.9rem;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
  .inp:focus{outline:2px solid var(--teal);outline-offset:1px;background:var(--surface)}
  .syncstat{font-size:.88rem;margin:0 0 12px;font-weight:600}
  .syncstat.ok{color:var(--green)} .syncstat.busy{color:var(--amber)} .syncstat.err{color:var(--red)}

  footer{color:var(--faint);font-size:.8rem;text-align:center;padding:20px 0}
  @media (max-width:480px){ .stat .nm{width:96px} }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="row1">
      <span class="brand"><span class="dot"></span>P12 Tracker</span>
      <div class="bar"><span id="ovfill"></span></div>
      <span id="ovpct" class="mono">0%</span>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>

<main class="wrap" id="main"></main>

<input type="file" id="importfile" accept="application/json,.json" hidden>
<footer>P12 Prep Tracker · progress saves in this browser on this device · use Export/Import to move between devices · <span id="saved"></span></footer>

/* ============================ STATE ============================ */
const LS_KEY="p12tracker_v1";
let state={checks:{},notes:{},updated:null};
try{ const raw=localStorage.getItem(LS_KEY); if(raw) state=Object.assign(state,JSON.parse(raw)); }catch(e){}

let saveTimer=null;
function save(){
  state.updated=new Date().toISOString();
  try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }catch(e){}
  const el=document.getElementById('saved');
  if(el) el.textContent="saved "+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,400); if(typeof scheduleSync==="function") scheduleSync(); }

/* collect all item ids for progress */
const SECTIONS=DATA.filter(s=>s.groups);
function itemsOf(sec){ let a=[]; sec.groups.forEach(g=>g.items.forEach(it=>a.push(it[0]))); return a; }
const ALL_IDS=[]; SECTIONS.forEach(s=>itemsOf(s).forEach(id=>ALL_IDS.push(id)));

/* ============================ RENDER ============================ */
const tabsEl=document.getElementById('tabs');
const mainEl=document.getElementById('main');
let active="dash";

function esc(){}
function buildTabs(){
  tabsEl.innerHTML="";
  DATA.forEach(sec=>{
    const b=document.createElement('button');
    b.dataset.tab=sec.id;
    const done = sec.groups ? itemsOf(sec).filter(id=>state.checks[id]).length : null;
    const tot = sec.groups ? itemsOf(sec).length : null;
    b.innerHTML = sec.icon+" "+sec.label + (sec.groups?(" <span class='n'>"+done+"/"+tot+"</span>"):"");
    if(sec.id===active) b.classList.add('active');
    b.onclick=()=>{ active=sec.id; render(); window.scrollTo(0,0); };
    tabsEl.appendChild(b);
  });
}

function renderRow(it){
  const [id,html]=it;
  const checked=!!state.checks[id];
  const note=state.notes[id]||"";
  const row=document.createElement('div');
  row.className="row"+(checked?" done":"")+(note?" hasnote":"");
  row.innerHTML =
    "<label class='chk'><input type='checkbox' "+(checked?"checked":"")+"></label>"+
    "<div class='main'><div class='txt'>"+html+"</div>"+
      "<div class='notewrap' "+(note?"":"hidden")+"><textarea placeholder='Your notes… (saved automatically)'>"+
      note.replace(/</g,"&lt;")+"</textarea></div></div>"+
    "<button class='notebtn"+(note?" has":"")+"' title='Add / show note'>📝</button>";
  const cb=row.querySelector('input');
  const btn=row.querySelector('.notebtn');
  const nw=row.querySelector('.notewrap');
  const ta=row.querySelector('textarea');
  cb.addEventListener('change',()=>{
    if(cb.checked) state.checks[id]=1; else delete state.checks[id];
    row.classList.toggle('done',cb.checked);
    saveSoon(); refreshProgress();
  });
  btn.addEventListener('click',()=>{ nw.hidden=!nw.hidden; if(!nw.hidden) ta.focus(); });
  ta.addEventListener('input',()=>{
    const v=ta.value;
    if(v.trim()) state.notes[id]=v; else delete state.notes[id];
    btn.classList.toggle('has',!!v.trim());
    row.classList.toggle('hasnote',!!v.trim());
    saveSoon();
  });
  return row;
}

function renderSection(sec){
  const frag=document.createDocumentFragment();
  const head=document.createElement('div');
  head.className="panelhead";
  head.innerHTML="<p class='ey'>"+sec.icon+" "+sec.label+"</p><h1>"+sec.intro.h+"</h1><p class='lead'>"+sec.intro.p+"</p>";
  frag.appendChild(head);
  sec.groups.forEach(g=>{
    const done=g.items.filter(it=>state.checks[it[0]]).length;
    const card=document.createElement('div');
    card.className="group";
    let h="<div class='gt'><span class='gprog'>"+done+"/"+g.items.length+"</span>"+g.t+"</div>";
    if(g.s) h+="<div class='gs'>"+g.s+"</div>";
    card.innerHTML=h;
    const rows=document.createElement('div');
    rows.className="rows";
    g.items.forEach(it=>rows.appendChild(renderRow(it)));
    card.appendChild(rows);
    frag.appendChild(card);
  });
  return frag;
}

function render(){
  buildTabs();
  mainEl.innerHTML="";
  if(active==="dash"){ mainEl.appendChild(renderDash()); wireDash(); }
  else{ const sec=DATA.find(s=>s.id===active); mainEl.appendChild(renderSection(sec)); }
  refreshProgress();
}

function refreshProgress(){
  const done=ALL_IDS.filter(id=>state.checks[id]).length;
  const p=ALL_IDS.length?Math.round(done*100/ALL_IDS.length):0;
  document.getElementById('ovfill').style.width=p+"%";
  document.getElementById('ovpct').textContent=p+"%";
  // update tab counts
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const sec=DATA.find(s=>s.id===b.dataset.tab);
    if(sec&&sec.groups){ const ids=itemsOf(sec); const d=ids.filter(id=>state.checks[id]).length;
      const n=b.querySelector('.n'); if(n) n.textContent=d+"/"+ids.length; }
  });
}

/* ============================ SYNC ============================ */
function wireDash(){
  document.getElementById('btnExport').onclick=exportJSON;
  document.getElementById('btnImport').onclick=()=>document.getElementById('importfile').click();
  document.getElementById('btnReset').onclick=()=>{
    if(!confirm("Reset ALL ticks and notes on this device? (Export first if you want a backup.)")) return;
    state={checks:{},notes:{},updated:new Date().toISOString(),exportedAt:state.exportedAt}; save(); render(); if(ghCfg().token) ghPushNow();
  };
  // cloud sync controls
  const ghSaveBtn=document.getElementById('ghSave');
  if(ghSaveBtn) ghSaveBtn.onclick=()=>{
    const t=(document.getElementById('ghtok').value||"").trim();
    if(!t){ alert("Paste your GitHub token first."); return; }
    ghSetCfg({token:t,auto:true}); ghSha=null; render(); setTimeout(ghInitialSync,50);
  };
  const ghNowBtn=document.getElementById('ghNow'); if(ghNowBtn) ghNowBtn.onclick=ghPushNow;
  const ghOffBtn=document.getElementById('ghOff'); if(ghOffBtn) ghOffBtn.onclick=()=>{
    if(!confirm("Disconnect and remove the token from this browser? Your synced file on GitHub stays.")) return;
    ghSetCfg({}); ghSha=null; render();
  };
  const ghAutoCb=document.getElementById('ghAuto'); if(ghAutoCb) ghAutoCb.onchange=()=>{
    const c=ghCfg(); c.auto=ghAutoCb.checked; ghSetCfg(c);
    setStat(ghAutoCb.checked?"Auto-sync on":"Auto-sync off (use Sync now)", ghAutoCb.checked?"ok":"busy");
    if(ghAutoCb.checked) ghPushNow();
  };
}
function exportJSON(){
  const now=new Date().toISOString();
  const payload={app:"p12-tracker",version:1,exportedAt:now,
    checks:state.checks,notes:state.notes};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download="p12-progress.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  state.exportedAt=now; save(); if(active==="dash") render();
}
document.getElementById('importfile').addEventListener('change',function(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    try{
      const d=JSON.parse(r.result);
      if(!d||typeof d!=="object"||!("checks" in d)) throw new Error("bad file");
      if(!confirm("Load progress from this file? It replaces your current ticks & notes on this device.")) return;
      state.checks=d.checks||{}; state.notes=d.notes||{};
      if(d.exportedAt) state.exportedAt=d.exportedAt;
      save(); active="dash"; render();
      alert("Imported ✅  "+Object.keys(state.checks).length+" items ticked, "+Object.keys(state.notes).length+" notes.");
    }catch(err){ alert("Couldn't read that file — make sure it's a p12-progress.json exported from here."); }
    e.target.value="";
  };
  r.readAsText(f);
});

/* ---------- GitHub cloud sync (optional, token stored only in this browser) ---------- */
const GH={owner:"iamsantanu21",repo:"iamsantanu21.github.io",path:"p12/p12-progress.json",branch:"main"};
const GH_KEY="p12_gh_v1";
let ghSha=null, ghTimer=null, ghBusy=false;
function ghCfg(){ try{ return JSON.parse(localStorage.getItem(GH_KEY))||{}; }catch(e){ return {}; } }
function ghSetCfg(c){ try{ localStorage.setItem(GH_KEY,JSON.stringify(c)); }catch(e){} }
function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(b){ try{ return decodeURIComponent(escape(atob(b))); }catch(e){ return atob(b); } }
function setStat(t,cls){ const e=document.getElementById('syncstat'); if(e){ e.textContent=t; e.className="syncstat "+(cls||""); } }
function ghHead(tok){ return {"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}; }
async function ghGet(tok){
  const url="https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/contents/"+encodeURIComponent(GH.path)+"?ref="+GH.branch+"&t="+Date.now();
  const r=await fetch(url,{headers:ghHead(tok)});
  if(r.status===404){ ghSha=null; return null; }
  if(!r.ok) throw new Error("read "+r.status);
  const j=await r.json(); ghSha=j.sha;
  try{ return JSON.parse(b64d((j.content||"").replace(/\n/g,""))); }catch(e){ return null; }
}
async function ghPut(tok){
  const now=new Date().toISOString();
  const payload={app:"p12-tracker",version:1,updated:now,checks:state.checks,notes:state.notes};
  const body={message:"Update p12 progress",content:b64e(JSON.stringify(payload,null,2)),branch:GH.branch};
  if(ghSha) body.sha=ghSha;
  const url="https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/contents/"+encodeURIComponent(GH.path);
  let r=await fetch(url,{method:"PUT",headers:ghHead(tok),body:JSON.stringify(body)});
  if(r.status===409){ await ghGet(tok); if(ghSha) body.sha=ghSha; r=await fetch(url,{method:"PUT",headers:ghHead(tok),body:JSON.stringify(body)}); }
  if(!r.ok){ let t=""; try{t=(await r.json()).message||"";}catch(e){} throw new Error((r.status===401||r.status===403)?"bad token / no access":("write "+r.status+" "+t)); }
  const j=await r.json(); ghSha=(j.content&&j.content.sha)||ghSha; state.updated=now; state.exportedAt=now; save();
}
async function ghPushNow(){
  const c=ghCfg(); if(!c.token) return;
  if(ghBusy){ return; } ghBusy=true; setStat("Syncing…","busy");
  try{ if(ghSha===null){ try{ await ghGet(c.token); }catch(e){} } await ghPut(c.token);
    setStat("Synced ✓  "+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),"ok"); }
  catch(e){ setStat("Sync error: "+e.message,"err"); }
  finally{ ghBusy=false; }
}
function scheduleSync(){ const c=ghCfg(); if(!c.token||c.auto===false) return; clearTimeout(ghTimer); setStat("Change saved — syncing…","busy"); ghTimer=setTimeout(ghPushNow,4000); }
async function ghInitialSync(){
  const c=ghCfg(); if(!c.token) return; setStat("Connecting…","busy");
  try{
    const remote=await ghGet(c.token);
    const lu=state.updated||"", ru=(remote&&remote.updated)||"";
    if(remote && ru>lu){ state.checks=remote.checks||{}; state.notes=remote.notes||{}; state.updated=remote.updated; state.exportedAt=remote.updated; save(); if(active==="dash") render(); else refreshProgress(); setStat("Loaded latest from GitHub ✓","ok"); }
    else if(!remote || lu>ru){ await ghPut(c.token); setStat("Synced ✓","ok"); }
    else setStat("Up to date ✓","ok");
  }catch(e){ setStat("Sync error: "+e.message,"err"); }
}

render();
if(state.updated){ const el=document.getElementById('saved'); if(el) el.textContent="last saved "+new Date(state.updated).toLocaleString(); }
if(ghCfg().token) ghInitialSync();
</script>
